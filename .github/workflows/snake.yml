name: Generate contribution snake

on:
  schedule:
    # Refresh the account-wide calendar at GitHub's shortest supported interval.
    # Avoid minute 0; scheduling and contribution indexing can still be delayed.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: woshibaizi
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publish snake animation
        uses: actions/github-script@v8
        with:
          retries: 3
          script: |
            const fs = require('node:fs/promises');
            const { createHash } = require('node:crypto');
            const branch = 'output';
            for (const path of [
              'github-contribution-grid-snake.svg',
              'github-contribution-grid-snake-dark.svg',
            ]) {
              const content = await fs.readFile(`dist/${path}`);
              const { data: current } = await github.rest.repos.getContent({
                ...context.repo, path, ref: branch,
              });
              const sha = createHash('sha1')
                .update(`blob ${content.length}\0`).update(content).digest('hex');
              if (current.sha === sha) {
                core.info(`${path} is already up to date`);
                continue;
              }
              await github.rest.repos.createOrUpdateFileContents({
                ...context.repo, path, branch, sha: current.sha,
                message: 'Refresh snake from the latest contribution calendar',
                content: content.toString('base64'),
              });
              core.info(`Updated ${path}`);
            }
